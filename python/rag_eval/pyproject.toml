[project]
name = "midcsi-rag-eval"
version = "0.1.0"
description = "Retrieval eval for MIDCSI Hub knowledge in Qdrant. Chat serving stays in Node."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_eval = ["gold.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
